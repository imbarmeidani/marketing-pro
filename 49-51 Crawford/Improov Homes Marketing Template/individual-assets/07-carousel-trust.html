          <p style="font-size:34px; line-height:1.5; color:rgba(255,255,255,0.88); margin:40px 0 0; max-width:900px;">Buying your first home, renting your next one, selling, or building a portfolio &mdash; we make the next move clear. No pressure. Just a plan, and people who pick up the phone.</p>

            <span style="font-family:var(--font-ui); font-weight:700; font-size:26px; color:#fff; border:2px solid rgba(255,255,255,0.35); border-radius:var(--radius-pill); padding:12px 26px;">Renters</span>

          </div>
        </div>
      </div></div><script>addEventListener('load',()=>{(async()=>{try{await document.fonts.ready}catch(e){}const imgs=[...document.images].filter(i=>!i.complete);await Promise.race([Promise.allSettled(imgs.map(i=>i.decode())),new Promise(r=>setTimeout(r,8000))]);setTimeout(()=>window.print(),400)})()})</script></body></html>
